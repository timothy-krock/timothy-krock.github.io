<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Die icon">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eceff3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="72" fill="url(#face)" stroke="#d7dce3" stroke-width="10" filter="url(#shadow)"/>

  <!-- pips (5 face) -->
  <circle cx="152" cy="152" r="28" fill="#12161c"/>
  <circle cx="360" cy="152" r="28" fill="#12161c"/>
  <circle cx="256" cy="256" r="28" fill="#12161c"/>
  <circle cx="152" cy="360" r="28" fill="#12161c"/>
  <circle cx="360" cy="360" r="28" fill="#12161c"/>
</svg>
